<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded border border-gray-200 p-6 w-96">
        <h1 class="font-bold text-gray-800 mb-4">Editar Cliente</h1>
        <form action="/editar/{{ cliente.id_cliente }}" method="POST">
            <div class="flex flex-col gap-3">
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Nombre</label>
                    <input type="text" name="nombre" value="{{ cliente.nombre }}"
                        class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Correo</label>
                    <input type="email" name="correo" value="{{ cliente.correo }}"
                        class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Telefono</label>
                    <input type="text" name="telefono" value="{{ cliente.telefono }}"
                        class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1">Direccion</label>
                    <input type="text" name="direccion" value="{{ cliente.direccion }}"
                        class="w-full border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-2 mt-2">
                    <button type="submit"
                        class="flex-1 bg-blue-900 text-white py-2 rounded text-sm hover:bg-blue-800">
                        Guardar
                    </button>
                    <a href="/"
                        class="flex-1 text-center border border-gray-300 text-gray-600 py-2 rounded text-sm hover:bg-gray-50">
                        Cancelar
                    </a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
